services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      # Loopback hôte uniquement. POSTGRES_PORT permet à un déploiement serveur
      # de choisir un port libre sans éditer ce fichier (défaut = dev local).
      - "127.0.0.1:${POSTGRES_PORT:-55434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs}
      POSTGRES_DB: ${POSTGRES_DB:-content_studio}
      # postgres:18 attend un layout de data dir major-version-specific ;
      # sans ce PGDATA nested, le conteneur crash au boot sur un volume
      # monté directement sur /var/lib/postgresql/data (docker-library/postgres#1259).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `app` attend cette sonde (depends_on: service_healthy) : sans elle, le
      # migrateur tape sur une base qui n'accepte pas encore les connexions et
      # brûle son budget de retry pour rien à chaque `up`.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs} -d ${POSTGRES_DB:-content_studio}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    ports:
      # Loopback host-side, comme postgres ci-dessus : le conteneur écoute
      # toujours 0.0.0.0 en interne (HOSTNAME=0.0.0.0, requis par le NAT de
      # publication de port de Docker), mais le port n'est publié QUE sur
      # l'interface loopback de la machine hôte — injoignable depuis le
      # réseau/internet par défaut. Exposer publiquement = un reverse-proxy
      # ou un tunnel en conscience (cf. README, section Sécurité / déploiement),
      # pas ce mapping par défaut.
      - "127.0.0.1:${APP_PORT:-3003}:3003"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cs}:${POSTGRES_PASSWORD:-cs}@postgres:5432/${POSTGRES_DB:-content_studio}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET requis}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3003}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
